name: Release

# 触发方式：
#   1) 打 tag 并推送（`git tag v0.5.2 && git push origin v0.5.2`）→ 编译 + 发布 Release；
#   2) 手动 Run：填了 publish_tag 就**重新生成该 tag 的说明与资产**（用于修正已发布的
#      Release），留空则只编译并上传 artifact（试跑用）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "要重新发布的 tag（例如 v0.5.2）；留空则只编译、不发布"
        required: false
        default: ""

# `gh release create/edit` 需要写权限；其余权限一律不给。
permissions:
  contents: write

# 同一个 tag 重复触发时排队执行，不并发（避免两次发布抢同一个名字）。
concurrency:
  group: release-${{ inputs.publish_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 发布产物就在 dist/ 下，与本机手工打包的目录一致。
  INSTALLER_VERSION: "6.7.3"
  # Inno Setup 6.7.3 官方安装包的 SHA-256（与 winget 清单一致，见 docs/DEVELOPMENT.md）。
  INSTALLER_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"

jobs:
  windows-x64:
    name: Windows x64 安装包
    runs-on: windows-latest
    # 冷启动含依赖编译约 15–25 分钟；超过 45 分钟基本是卡在某个对话框上。
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 发布说明要按「上一个 tag 到本 tag」的提交生成，必须拿到完整历史与标签。
          fetch-depth: 0
          # 手动重发时按指定 tag 检出，保证产物与说明都对应那一次发布。
          ref: ${{ inputs.publish_tag || github.ref }}

      # 仓库里的 .cargo/config.toml 把 crates.io 换成了 USTC 镜像（国内开发机用）。
      # Runner 在境外，镜像反而更慢甚至不可达；该文件头部也写明了「不在中国大陆
      # 就删掉这两段」。这里直接移走它，让 cargo 回落官方 crates.io。
      - name: 使用 crates.io（跳过国内镜像）
        shell: pwsh
        run: |
          if (Test-Path .cargo/config.toml) {
            Remove-Item .cargo/config.toml -Force
            Write-Host "已移除 .cargo/config.toml（USTC 镜像）"
          }

      # rustup 会按 rust-toolchain.toml（stable）自动安装工具链。
      - name: 安装 Rust 工具链
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc -vV
          cargo -V

      # 只缓存 ~/.cargo 与 target；key 里带 Cargo.lock，依赖没变才命中。
      - name: 缓存依赖与构建产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-release

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ inputs.publish_tag }}'
          if (-not $tag -and '${{ github.ref_type }}' -eq 'tag') { $tag = '${{ github.ref_name }}' }

          if ($tag) {
            # 只接受 vX.Y.Z 或 vX.Y.Z-rc.1 这类形式：安装包的版本列必须可解析。
            if ($tag -notmatch '^v(?<num>\d+\.\d+\.\d+)(?<pre>-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
              throw "标签格式必须是 vX.Y.Z（可带预发布后缀，如 v1.0.0-rc.1），当前是「$tag」"
            }
            $numeric = $Matches['num']
            $pre = $Matches['pre']
            $version = "$numeric$pre"
            $prerelease = [bool]$pre
            $publish = $true
          } else {
            # 手动试跑：版本号只用于给 artifact 起名，不参与发布。
            $version = "0.0.0-dev.${{ github.run_number }}"
            $numeric = '0.0.0'
            $prerelease = $false
            $publish = $false
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          # 布尔值统一写成小写 true/false：下游用 'true' 比较，不依赖大小写规则。
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "构建版本：$version（tag=$tag，发布=$publish，预发布=$prerelease）"

      # 版本号以 tag 为准（本项目约定）。Cargo.toml 与 files.iss 里的默认值只是
      # 「本机构建时用多少」，发版时应当顺手改成同一个版本；这里比对一次，
      # 不一致就报 warning 提醒，但**不阻断**发布——tag 是唯一事实来源。
      - name: 检查版本一致性
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'

          $cargoVersion = $null
          $inSection = $false
          foreach ($line in Get-Content 'Cargo.toml') {
            if ($line -match '^\[workspace\.package\]') { $inSection = $true; continue }
            if ($inSection -and $line -match '^\[') { break }
            if ($inSection -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $cargoVersion = $Matches[1]; break }
          }

          $issVersion = $null
          foreach ($line in Get-Content 'installer/files.iss') {
            if ($line -match '^\s*#define\s+AppVersion\s+"([^"]+)"') { $issVersion = $Matches[1]; break }
          }

          $drift = @()
          if ($cargoVersion -ne $version) { $drift += "Cargo.toml 的 workspace.package.version = $cargoVersion" }
          if ($issVersion -ne $version) { $drift += "installer/files.iss 的默认 AppVersion = $issVersion" }
          if ($drift.Count -eq 0) {
            Write-Host "版本一致：$version"
          } else {
            $message = "发版版本是 $version（以 tag 为准），但 $($drift -join '；')。安装包会按 $version 命名，无需改 tag；建议把这两处改成 $version 后一并提交。"
            Write-Host "::warning::$message"
            "- 版本提示：$message" >> $env:GITHUB_STEP_SUMMARY
          }

      # --locked：用仓库里的 Cargo.lock，不让 CI 悄悄升级依赖。
      - name: 编译发布产物
        shell: pwsh
        run: |
          cargo build --release -p fm-app --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build 失败（退出码 $LASTEXITCODE）" }
          if (-not (Test-Path target/release/pagefold.exe)) { throw "没有产出 pagefold.exe" }

      # 发布前的门槛：单元测试必须全绿。--release 复用上一步的产物，
      # 只额外编译测试目标，比在 dev profile 下重编一遍便宜得多。
      - name: 单元测试（发布门槛）
        shell: pwsh
        run: |
          cargo test --workspace --release --locked
          if ($LASTEXITCODE -ne 0) { throw "测试失败，终止发布（退出码 $LASTEXITCODE）" }

      # Inno Setup 不装进系统：官方安装包支持免管理员 portable 解包，
      # 与 docs/DEVELOPMENT.md 记录的本机流程一致（版本、哈希都钉死）。
      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$env:INSTALLER_VERSION.exe"
          $file = "target/innosetup-$env:INSTALLER_VERSION.exe"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile $file -MaximumRetryCount 3
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INSTALLER_SHA256) {
            throw "Inno Setup 校验失败：期望 $env:INSTALLER_SHA256，实际 $hash"
          }
          $dir = Join-Path $PWD 'target\innosetup'
          # 命中缓存时目录可能已存在：先清掉，避免 portable 解包与旧文件混在一起。
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $process = Start-Process -FilePath $file -Wait -PassThru -ArgumentList @(
            '/PORTABLE=1', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir"
          )
          if ($process.ExitCode -ne 0) { throw "Inno Setup 解包失败（退出码 $($process.ExitCode)）" }
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw "Inno Setup 解包后找不到 ISCC.exe" }

      # 版本号通过 ISPP 的 /D 传给脚本（installer/files.iss 里用 #ifndef 兜底默认值）。
      - name: 编译安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $quad = '${{ steps.version.outputs.numeric }}.0'
          # 干净检出里没有 dist/（不入库），先建出来再让 ISCC 往里写。
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          & 'target\innosetup\ISCC.exe' "/DAppVersion=$version" "/DAppVersionQuad=$quad" 'installer\files.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败（退出码 $LASTEXITCODE）" }
          $installer = "dist\Pagefold-$version-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "没有产出 $installer" }
          Write-Host "已生成 $installer"

      # 给下载页一个可校验的哈希：Windows 用户拿到 exe 后能自己核对。
      - name: 生成 SHA-256
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "dist/Pagefold-$version-x64-setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Pagefold-$version-x64-setup.exe" | Out-File -FilePath 'dist/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist/SHA256SUMS.txt'
          # 写进 Actions 的作业摘要，省得为了一次校验下载整个产物。
          @(
            "## Pagefold $version"
            ""
            "- 安装包：Pagefold-$version-x64-setup.exe"
            "- SHA-256：$hash"
          ) >> $env:GITHUB_STEP_SUMMARY

      # 发布说明由提交历史生成，而不是 `gh --generate-notes`：
      # 本项目直接往 main 推、提交是中文的 `feat(shell): …`，自动生成的 notes
      # 只剩一句 Full Changelog。这里按提交前缀分组，把「新增 / 修复 / 构建」
      # 分开，再补上下载、校验与升级注意——这几段是用户真正要先看的。
      - name: 生成发布说明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $publish = '${{ steps.version.outputs.publish }}' -eq 'true'
          $repo = '${{ github.repository }}'
          $server = '${{ github.server_url }}'

          # 中文提交必须按 UTF-8 读入，否则写进说明里全是问号。
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:GIT_PAGER = 'cat'

          # 上一个 tag：首个 tag 时退到「仓库第一个提交」。
          # 纯试跑时不用区间，只取最近 20 个提交（区间写法在提交数不足时会直接报错）。
          $range = ''
          if ($publish) {
            $previous = & git describe --tags --abbrev=0 "$tag^" 2>$null
            if ($LASTEXITCODE -eq 0 -and $previous) {
              $range = "$previous..$tag"
            } else {
              $first = (& git rev-list --max-parents=0 HEAD | Select-Object -Last 1)
              $range = "$first..$tag"
            }
          }
          $logArgs = if ($range) { @($range, '--no-merges') } else { @('-n', '20', '--no-merges') }
          Write-Host "提交来源：$(if ($range) { $range } else { '最近 20 个提交' })"

          # 用 \x1f / \x1e 分隔字段与记录：提交正文里可能有换行，不能按行切。
          $raw = (& git log @logArgs --pretty=format:'%H%x1f%s%x1e') -join "`n"

          $groups = [ordered]@{
            '新增'       = @()
            '修复'       = @()
            '性能'       = @()
            '重构'       = @()
            '文档'       = @()
            '构建与发布' = @()
            '测试'       = @()
            '其他'       = @()
          }

          foreach ($record in ($raw -split [char]0x1e)) {
            $record = $record.Trim()
            if (-not $record) { continue }
            $fields = $record -split [char]0x1f
            $sha = $fields[0]
            $subject = $fields[1]
            if (-not $subject) { continue }

            $desc = $subject
            $scope = ''
            $kind = '其他'
            if ($subject -match '^(?<type>[A-Za-z]+)(\((?<scope>[^)]+)\))?!?:\s*(?<desc>.+)$') {
              $type = $Matches['type'].ToLower()
              $scope = $Matches['scope']
              $desc = $Matches['desc']
              $kind = switch ($type) {
                'feat' { '新增' }
                'fix' { '修复' }
                'perf' { '性能' }
                'refactor' { '重构' }
                'docs' { '文档' }
                'ci' { '构建与发布' }
                'build' { '构建与发布' }
                'chore' { '构建与发布' }
                'test' { '测试' }
                default { '其他' }
              }
            }

            $short = $sha.Substring(0, 7)
            $link = "$server/$repo/commit/$sha"
            # scope 用加粗保留：同一类改动里，能一眼看出动的是 shell 还是 platform。
            $item = if ($scope) { "- **$scope**：$desc（[$short]($link)）" } else { "- $desc（[$short]($link)）" }
            $groups[$kind] += $item
          }

          $hash = (Get-Content 'dist/SHA256SUMS.txt' -Raw).Trim() -split '\s+' | Select-Object -First 1

          # 含反引号的段落一律用单引号拼接：双引号里的 ` 是转义符，会把 markdown 吃掉。
          $checksumLine = '- 校验值见附件 `SHA256SUMS.txt`，安装包 SHA-256：`' + $hash + '`'
          # 固定的一行产品说明：发布页不该只有 changelog，第一次来的用户要知道这是什么。
          $intro = 'Pagefold（叠页）— Windows 上的轻量文件管理器：多标签、图标 / 详情双视图、批量重命名与可撤销的文件操作。'
          $lines = @(
            $intro
            ''
            '## 下载与安装'
            ''
            "- **Pagefold-$version-x64-setup.exe** — 用户级安装，全程不弹 UAC"
            '- 需要 Windows 10 或更高版本（x64）'
            $checksumLine
            ''
            "## 本次更新 · v$version"
            ''
          )

          # 只有构建/文档类改动时，明说「没有用户可见变化」——比让用户对着
          # 一条 CI 记录猜「这版到底更新了什么」要好。
          $userVisible = @('新增', '修复', '性能', '重构') | Where-Object { $groups[$_].Count -gt 0 }
          if (-not $userVisible) {
            $lines += '_本次发布只包含构建、文档与发布流程的调整，没有用户可见的功能变化。_'
            $lines += ''
          }

          $empty = $true
          foreach ($name in $groups.Keys) {
            if ($groups[$name].Count -eq 0) { continue }
            $empty = $false
            $lines += "### $name"
            $lines += ''
            $lines += $groups[$name]
            $lines += ''
          }
          if ($empty) { $lines += '_本次发布没有代码变更。_'; $lines += '' }

          $lines += '## 完整变更'
          $lines += ''
          # 有上一个 tag 就给 compare 链接，否则给提交列表（首个版本的情况）。
          $linkRef = if ($tag) { $tag } else { 'HEAD' }
          $compare = "[全部提交]($server/$repo/commits/$linkRef)"
          if ($range.Contains('..')) {
            $from = ($range -split '\.\.', 2)[0]
            if ($from.StartsWith('v')) {
              $compare = "[$from...$tag]($server/$repo/compare/$from...$tag)"
            }
          }
          $lines += $compare
          $lines += ''
          $lines += '> 升级安装会先结束正在运行的实例（含无窗口的热键宿主）；卸载会先还原文件夹接管再删文件，'
          $lines += '> 用户偏好目录 `%APPDATA%\pagefold` 默认保留。'

          $lines | Out-File -FilePath 'dist/notes.md' -Encoding utf8
          Write-Host '--- 发布说明预览 ---'
          Get-Content 'dist/notes.md'

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Pagefold-${{ steps.version.outputs.version }}-x64-setup
          path: |
            dist/Pagefold-*-x64-setup.exe
            dist/SHA256SUMS.txt
            dist/notes.md
          if-no-files-found: error

      # 发布或更新 Release。已存在时走「更新说明 + 覆盖资产」这条路，
      # 因此修正某个已发布版本的说明不需要删 tag 重打。
      - name: 发布 Release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $prerelease = '${{ steps.version.outputs.prerelease }}' -eq 'true'
          $installer = "dist/Pagefold-$version-x64-setup.exe"

          $arguments = @(
            'release', 'create', $tag,
            $installer,
            'dist/SHA256SUMS.txt',
            '--title', "Pagefold $version",
            '--notes-file', 'dist/notes.md',
            '--verify-tag'
          )
          if ($prerelease) { $arguments += '--prerelease' }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Release 已存在：改为更新说明并覆盖资产'
            $edit = @('release', 'edit', $tag, '--title', "Pagefold $version", '--notes-file', 'dist/notes.md')
            if ($prerelease) { $edit += '--prerelease' }
            & gh @edit
            if ($LASTEXITCODE -ne 0) { throw '更新 Release 说明失败' }
            & gh release upload $tag $installer 'dist/SHA256SUMS.txt' --clobber
            if ($LASTEXITCODE -ne 0) { throw '上传 Release 资产失败' }
          }
