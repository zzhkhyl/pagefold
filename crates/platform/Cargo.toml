[package]
name = "fm-platform"
description = "平台抽象层：FileSystem 等平台无关契约及 Windows / mock 实现"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
fm-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # WNDCLASSW 里的 `hbrBackground: HBRUSH` 来自 Gdi 模块，
    # 缺了它 RegisterClassW 与 WNDCLASSW 会被 cfg 掉。
    "Win32_Graphics_Gdi",
    # RegCreateKeyExW 与 CreateMutexW 的签名里带 SECURITY_ATTRIBUTES。
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
